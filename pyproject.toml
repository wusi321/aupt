[build-system]
# Python 3.6 cannot install modern setuptools. The legacy backend reads the
# setup.py below and keeps source installs working on old distributions.
requires = [
  "setuptools>=45,<61; python_version < '3.7'",
  "setuptools>=61; python_version >= '3.7'",
]
build-backend = "setuptools.build_meta:__legacy__"
